# Keyboard driving of the gait-conditioned policy (gait_cond_steering env): 1/2/3 pick the commanded
# gait, W/S speed, A/D turn, arrows move the camera. Use with a model trained on gait_cond_steering_go2_env.
env_name: "gait_cond_steering"

char_file: "data/assets/go2/go2.xml"
camera_mode: "track"

episode_length: 600.0 # seconds (long, for manual driving)
global_obs: False
root_height_obs: True
pose_termination: False
enable_phase_obs: False
enable_tar_obs: False
num_disc_obs_steps: 10
rand_reset: False         # start from init_pose (standing), not from a random clip frame

ref_char_offset: [2.0, 0.0, 0.0] # m
init_pose: [0, 0, 0.27, 0, 0, 0, 0, 0.9, -1.8, 0, 0.9, -1.8, 0, 0.9, -1.8, 0, 0.9, -1.8]

enable_early_termination: True
key_bodies: ["FR_foot", "FL_foot", "RR_foot", "RL_foot"]
contact_bodies: ["FR_foot", "FL_foot", "RR_foot", "RL_foot"]

# All Go2 clips, weighted 25% per gait class (see the dataset file)
motion_file: "data/datasets/dataset_go2_all_gaits.yaml"

# Steering task: a random target direction and speed are resampled every 4-7 s.
# The speed range covers the reference clips (walk/pace ~1.1, trot ~1.9, run ~3.2 m/s),
# the target speed is part of the policy observation, and the velocity error is two-sided
# (too slow and too fast are both penalized), so high target speeds call for faster gaits.
# Gait conditioning: the commanded class of an episode is the class of the clip drawn at reset (RSI).
# walk and pace are one class, as in the footfall classifier of tools/gait_analysis.
gait_classes: ["walk_pace", "trot", "run"]
gait_clip_classes:        # substring of the clip file name -> class
  "go2_walk": "walk_pace"
  "go2_pace": "walk_pace"
  "go2_trot": "trot"
  "go2_run": "run"
gait_speed_ranges:        # target speed drawn inside the range of the commanded class (m/s)
  walk_pace: [0.6, 1.4]
  trot: [1.4, 2.2]
  run: [2.4, 3.2]

manual_init_gait: "walk_pace"

rand_tar_dir: True
rand_face_dir: False      # face the direction of travel
tar_speed_min: 0.6        # m/s
tar_speed_max: 3.2        # m/s
tar_change_time_min: 4.0  # s
tar_change_time_max: 7.0  # s

reward_steering_tar_w: 0.7        # velocity tracking
reward_steering_face_w: 0.3       # facing the target direction
reward_steering_vel_scale: 0.5    # r = exp(-0.5 * |v_target - v|^2)

# DeepMimic tracking weights (unused by AMP, kept for config compatibility)
reward_pose_w: 0.5
reward_vel_w: 0.1
reward_root_pose_w: 0.15
reward_root_vel_w: 0.1
reward_key_pos_w: 0.15

reward_pose_scale: 0.25
reward_vel_scale: 0.01
reward_root_pose_scale: 5.0
reward_root_vel_scale: 1.0
reward_key_pos_scale: 10.0

engine:
  ground_contact_height: 0.15 # this is needed for IsaacGym

# Manual control (test mode with --visualize true): the keyboard sets the target, the random
# resampling is off. Hold W/S = speed, hold A/D = turn (arrows keep moving the camera). Same observation
# and reward as the training env, so any steering checkpoint can be driven with this file.
manual_control: True
manual_init_speed: 1.0       # m/s
manual_speed_rate: 0.8       # m/s per second while W/S is held
manual_turn_rate_deg: 90.0   # deg per second while A/D is held
